kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8000
name = "API Server"
paths = ["/api", "/health", "/healthz", "/astronauts", "/companion/support", "/simulate", "/docs", "/redoc", "/openapi.json"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production.build]
args = ["uv", "sync", "--frozen"]

[services.production.run]
args = ["uv", "run", "--frozen", "python", "-m", "backend.main"]

[services.production.run.env]
PORT = "8000"

[services.production.health.startup]
path = "/api/healthz"
