[project]
name = "spacehealth-backend"
version = "0.1.0"
description = "Offline-first, non-diagnostic astronaut health demo API"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pytest>=8,<10",
    "pyyaml>=6,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5,<2"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
