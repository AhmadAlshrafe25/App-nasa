openapi: 3.1.0
info:
  title: Api
  description: Offline-first onboard health backend. Detection, risk scoring and companion
    fallback run locally; check-ins queue for Earth sync with a simulated 14-minute
    Mars delay. Not a medical device.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - system
      summary: Health
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /astronauts/{astronaut_id}/dashboard:
    get:
      tags:
      - astronauts
      summary: Dashboard
      operationId: dashboard
      parameters:
      - name: astronaut_id
        in: path
        required: true
        schema:
          type: string
          title: Astronaut Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /astronauts/{astronaut_id}/checkin:
    post:
      tags:
      - astronauts
      summary: Checkin
      operationId: checkin
      parameters:
      - name: astronaut_id
        in: path
        required: true
        schema:
          type: string
          title: Astronaut Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /companion/support:
    post:
      tags:
      - companion
      summary: Companion Support
      operationId: companion_support
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /family/messages:
    post:
      tags:
      - family
      summary: Post Family Message
      operationId: post_family_message
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyMessageIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /family/messages/{astronaut_id}:
    get:
      tags:
      - family
      summary: List Family Messages
      operationId: list_family_messages
      parameters:
      - name: astronaut_id
        in: path
        required: true
        schema:
          type: string
          title: Astronaut Id
      - name: mood_tag
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - anxious
            - lonely
            - tired
            - general
            type: string
          - type: 'null'
          title: Mood Tag
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilyMessage'
                title: Response List Family Messages
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /family/messages/{message_id}/viewed:
    patch:
      tags:
      - family
      summary: Mark Family Message Viewed
      operationId: mark_family_message_viewed
      parameters:
      - name: message_id
        in: path
        required: true
        schema:
          type: integer
          title: Message Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /mission/sync-status:
    get:
      tags:
      - mission
      summary: Sync Status
      operationId: sync_status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
  /mission/sync:
    post:
      tags:
      - mission
      summary: Mission Sync
      operationId: mission_sync
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
  /simulate/{scenario}:
    get:
      tags:
      - simulate
      summary: Simulate
      operationId: simulate
      parameters:
      - name: scenario
        in: path
        required: true
        schema:
          type: string
          title: Scenario
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /healthz:
    get:
      tags:
      - system
      summary: Healthz
      operationId: healthCheck
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  schemas:
    Assessment:
      properties:
        risk_level:
          type: string
          enum:
          - Normal
          - Attention Required
          - High Priority Alert
          title: Risk Level
        risk_score:
          type: integer
          title: Risk Score
        reasons:
          items:
            type: string
          type: array
          title: Reasons
        recommended_actions:
          items:
            type: string
          type: array
          maxItems: 3
          minItems: 1
          title: Recommended Actions
        next_checkin_hours:
          type: integer
          enum:
          - 24
          - 6
          - 2
          title: Next Checkin Hours
        routine_prompt:
          type: string
          title: Routine Prompt
        baseline_comparison:
          additionalProperties:
            $ref: '#/components/schemas/MetricComparison'
          type: object
          title: Baseline Comparison
        trend_alerts:
          items:
            type: string
          type: array
          title: Trend Alerts
        isolation_forest:
          $ref: '#/components/schemas/IsolationForestResult'
        disclaimer:
          type: string
          title: Disclaimer
      type: object
      required:
      - risk_level
      - risk_score
      - reasons
      - recommended_actions
      - next_checkin_hours
      - routine_prompt
      - baseline_comparison
      - trend_alerts
      - isolation_forest
      - disclaimer
      title: Assessment
    Baseline:
      properties:
        log_count:
          type: integer
          title: Log Count
        sufficient_history:
          type: boolean
          title: Sufficient History
        metrics:
          additionalProperties:
            $ref: '#/components/schemas/MetricStat'
          type: object
          title: Metrics
      type: object
      required:
      - log_count
      - sufficient_history
      - metrics
      title: Baseline
    CheckInRequest:
      properties:
        heart_rate_bpm:
          type: number
          maximum: 250.0
          minimum: 20.0
          title: Heart Rate Bpm
        systolic_bp:
          type: number
          maximum: 260.0
          minimum: 50.0
          title: Systolic Bp
        diastolic_bp:
          type: number
          maximum: 160.0
          minimum: 30.0
          title: Diastolic Bp
        sleep_hours:
          type: number
          maximum: 24.0
          minimum: 0.0
          title: Sleep Hours
        stress_score:
          type: number
          maximum: 10.0
          minimum: 0.0
          title: Stress Score
        mood:
          type: string
          maxLength: 40
          minLength: 1
          title: Mood
          examples:
          - calm
        activity_minutes:
          type: number
          maximum: 1440.0
          minimum: 0.0
          title: Activity Minutes
        radiation_msv:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Radiation Msv
          description: Daily dose reading in mSv
        isolation_level:
          type: number
          maximum: 10.0
          minimum: 0.0
          title: Isolation Level
      type: object
      required:
      - heart_rate_bpm
      - systolic_bp
      - diastolic_bp
      - sleep_hours
      - stress_score
      - mood
      - activity_minutes
      - radiation_msv
      - isolation_level
      title: CheckInRequest
    CheckInResponse:
      properties:
        log_id:
          type: integer
          title: Log Id
        astronaut_id:
          type: string
          title: Astronaut Id
        sync_status:
          type: string
          title: Sync Status
        sync_note:
          type: string
          title: Sync Note
        assessment:
          $ref: '#/components/schemas/Assessment'
      type: object
      required:
      - log_id
      - astronaut_id
      - sync_status
      - sync_note
      - assessment
      title: CheckInResponse
    Dashboard:
      properties:
        astronaut_id:
          type: string
          title: Astronaut Id
        baseline:
          $ref: '#/components/schemas/Baseline'
        last_logs:
          items:
            $ref: '#/components/schemas/LogEntry'
          type: array
          title: Last Logs
        baseline_comparison:
          additionalProperties:
            $ref: '#/components/schemas/MetricComparison'
          type: object
          title: Baseline Comparison
        trend_alerts:
          items:
            type: string
          type: array
          title: Trend Alerts
        isolation_forest:
          $ref: '#/components/schemas/IsolationForestResult'
        risk_level:
          type: string
          enum:
          - Normal
          - Attention Required
          - High Priority Alert
          title: Risk Level
        reasons:
          items:
            type: string
          type: array
          title: Reasons
        recommended_actions:
          items:
            type: string
          type: array
          title: Recommended Actions
        next_checkin_hours:
          type: integer
          title: Next Checkin Hours
        routine_prompt:
          type: string
          title: Routine Prompt
      type: object
      required:
      - astronaut_id
      - baseline
      - last_logs
      - baseline_comparison
      - trend_alerts
      - isolation_forest
      - risk_level
      - reasons
      - recommended_actions
      - next_checkin_hours
      - routine_prompt
      title: Dashboard
    FamilyMessage:
      properties:
        astronaut_id:
          type: string
          maxLength: 40
          minLength: 1
          title: Astronaut Id
          examples:
          - AST-01
        sender_name:
          type: string
          maxLength: 80
          minLength: 1
          title: Sender Name
        relationship:
          type: string
          maxLength: 60
          minLength: 1
          title: Relationship
        media_type:
          type: string
          enum:
          - video
          - audio
          - text
          title: Media Type
        title:
          type: string
          maxLength: 120
          minLength: 1
          title: Title
        message_text:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Message Text
        media_url:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Media Url
          description: Required for audio/video
        mood_tag:
          type: string
          enum:
          - anxious
          - lonely
          - tired
          - general
          title: Mood Tag
          default: general
        id:
          type: integer
          title: Id
        is_viewed:
          type: boolean
          title: Is Viewed
        created_at:
          type: string
          title: Created At
      type: object
      required:
      - astronaut_id
      - sender_name
      - relationship
      - media_type
      - title
      - id
      - is_viewed
      - created_at
      title: FamilyMessage
    FamilyMessageIn:
      properties:
        astronaut_id:
          type: string
          maxLength: 40
          minLength: 1
          title: Astronaut Id
          examples:
          - AST-01
        sender_name:
          type: string
          maxLength: 80
          minLength: 1
          title: Sender Name
        relationship:
          type: string
          maxLength: 60
          minLength: 1
          title: Relationship
        media_type:
          type: string
          enum:
          - video
          - audio
          - text
          title: Media Type
        title:
          type: string
          maxLength: 120
          minLength: 1
          title: Title
        message_text:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Message Text
        media_url:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Media Url
          description: Required for audio/video
        mood_tag:
          type: string
          enum:
          - anxious
          - lonely
          - tired
          - general
          title: Mood Tag
          default: general
      type: object
      required:
      - astronaut_id
      - sender_name
      - relationship
      - media_type
      - title
      title: FamilyMessageIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthStatus:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: HealthStatus
    IsolationForestResult:
      properties:
        available:
          type: boolean
          title: Available
        anomaly_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Anomaly Score
          description: 0-1, higher = more unusual versus own history
        is_outlier:
          type: boolean
          title: Is Outlier
          default: false
        note:
          type: string
          title: Note
      type: object
      required:
      - available
      - note
      title: IsolationForestResult
    LogEntry:
      properties:
        heart_rate_bpm:
          type: number
          maximum: 250.0
          minimum: 20.0
          title: Heart Rate Bpm
        systolic_bp:
          type: number
          maximum: 260.0
          minimum: 50.0
          title: Systolic Bp
        diastolic_bp:
          type: number
          maximum: 160.0
          minimum: 30.0
          title: Diastolic Bp
        sleep_hours:
          type: number
          maximum: 24.0
          minimum: 0.0
          title: Sleep Hours
        stress_score:
          type: number
          maximum: 10.0
          minimum: 0.0
          title: Stress Score
        mood:
          type: string
          maxLength: 40
          minLength: 1
          title: Mood
          examples:
          - calm
        activity_minutes:
          type: number
          maximum: 1440.0
          minimum: 0.0
          title: Activity Minutes
        radiation_msv:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Radiation Msv
          description: Daily dose reading in mSv
        isolation_level:
          type: number
          maximum: 10.0
          minimum: 0.0
          title: Isolation Level
        id:
          type: integer
          title: Id
        astronaut_id:
          type: string
          title: Astronaut Id
        logged_at:
          type: string
          title: Logged At
        risk_level:
          anyOf:
          - type: string
          - type: 'null'
          title: Risk Level
      type: object
      required:
      - heart_rate_bpm
      - systolic_bp
      - diastolic_bp
      - sleep_hours
      - stress_score
      - mood
      - activity_minutes
      - radiation_msv
      - isolation_level
      - id
      - astronaut_id
      - logged_at
      title: LogEntry
    MetricComparison:
      properties:
        current:
          type: number
          title: Current
        baseline_mean:
          anyOf:
          - type: number
          - type: 'null'
          title: Baseline Mean
        baseline_std:
          anyOf:
          - type: number
          - type: 'null'
          title: Baseline Std
        z_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Z Score
        deviation_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Deviation Pct
        status:
          type: string
          enum:
          - within_range
          - elevated
          - markedly_elevated
          - reduced
          - markedly_reduced
          - insufficient_history
          title: Status
      type: object
      required:
      - current
      - baseline_mean
      - baseline_std
      - z_score
      - deviation_pct
      - status
      title: MetricComparison
    MetricStat:
      properties:
        mean:
          type: number
          title: Mean
        std:
          type: number
          title: Std
      type: object
      required:
      - mean
      - std
      title: MetricStat
    RecommendedFamilyMedia:
      properties:
        message:
          anyOf:
          - $ref: '#/components/schemas/FamilyMessage'
          - type: 'null'
        selection_reason:
          type: string
          title: Selection Reason
      type: object
      required:
      - selection_reason
      title: RecommendedFamilyMedia
    SimulationResponse:
      properties:
        scenario:
          type: string
          title: Scenario
        description:
          type: string
          title: Description
        astronaut_id:
          type: string
          title: Astronaut Id
        input:
          $ref: '#/components/schemas/CheckInRequest'
        assessment:
          $ref: '#/components/schemas/Assessment'
        companion:
          $ref: '#/components/schemas/SupportResponse'
        saved:
          type: boolean
          title: Saved
          default: false
      type: object
      required:
      - scenario
      - description
      - astronaut_id
      - input
      - assessment
      - companion
      title: SimulationResponse
    SupportRequest:
      properties:
        astronaut_id:
          type: string
          title: Astronaut Id
          examples:
          - AST-01
        allow_online:
          type: boolean
          title: Allow Online
          description: Set false to forbid sending state to the LLM even if LLM_API_KEY
            is set
          default: true
      type: object
      required:
      - astronaut_id
      title: SupportRequest
    SupportResponse:
      properties:
        astronaut_id:
          type: string
          title: Astronaut Id
        summary:
          type: string
          title: Summary
        relaxation_action:
          type: string
          title: Relaxation Action
        family_message_suggestion:
          type: string
          title: Family Message Suggestion
        selection_reason:
          type: string
          title: Selection Reason
        source:
          type: string
          enum:
          - offline_fallback
          - llm
          title: Source
        recommended_family_media:
          anyOf:
          - $ref: '#/components/schemas/RecommendedFamilyMedia'
          - type: 'null'
      type: object
      required:
      - astronaut_id
      - summary
      - relaxation_action
      - family_message_suggestion
      - selection_reason
      - source
      title: SupportResponse
    SyncItem:
      properties:
        id:
          type: integer
          title: Id
        log_id:
          type: integer
          title: Log Id
        astronaut_id:
          type: string
          title: Astronaut Id
        status:
          type: string
          title: Status
        queued_at:
          type: string
          title: Queued At
        synced_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Synced At
        payload:
          additionalProperties: true
          type: object
          title: Payload
      type: object
      required:
      - id
      - log_id
      - astronaut_id
      - status
      - queued_at
      - payload
      title: SyncItem
    SyncResult:
      properties:
        synced_count:
          type: integer
          title: Synced Count
        synced_at:
          type: string
          title: Synced At
        mars_delay_minutes:
          type: integer
          title: Mars Delay Minutes
        note:
          type: string
          title: Note
      type: object
      required:
      - synced_count
      - synced_at
      - mars_delay_minutes
      - note
      title: SyncResult
    SyncStatus:
      properties:
        pending_count:
          type: integer
          title: Pending Count
        mars_delay_minutes:
          type: integer
          title: Mars Delay Minutes
        pending_items:
          items:
            $ref: '#/components/schemas/SyncItem'
          type: array
          title: Pending Items
      type: object
      required:
      - pending_count
      - mars_delay_minutes
      - pending_items
      title: SyncStatus
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
servers:
- url: /api
  description: Shared preview API prefix; root aliases are also available
